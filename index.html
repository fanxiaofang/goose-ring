<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>鹅有一套</title>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <header id="throw-hud" aria-label="投掷场顶栏" hidden>
      <dl class="throw-hud-stats">
        <div><dt>本盘</dt><dd>—</dd></div>
        <div><dt>个人累计</dt><dd>—</dd></div>
        <div><dt>正式圈</dt><dd>—</dd></div>
        <div><dt>庙会币</dt><dd>—</dd></div>
        <div><dt>投掷</dt><dd id="throw-count">0</dd></div>
      </dl>
      <div class="throw-hud-actions">
        <button id="sound-toggle" type="button" aria-pressed="true">音效</button>
        <button id="clear-field" type="button">清场</button>
        <button id="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="false">调试</button>
      </div>
    </header>
    <div id="ui-safe-guide" hidden>
      <div class="safe-band safe-top"><span>顶部 UI 安全区 12%</span></div>
      <div class="safe-band safe-bottom"><span>底部 UI 安全区 8%</span></div>
    </div>
    <div id="debug-panel" hidden></div>
    <div id="rotate-overlay">
      <div class="rotate-icon">📱↻</div>
      <p>请将手机旋转到<b>横屏</b>游玩</p>
    </div>
    <div id="fatal-error" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
